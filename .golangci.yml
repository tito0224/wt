# golangci-lint configuration (v2). Defaults are deliberately kept: errcheck,
# govet, ineffassign, staticcheck, and unused. Run locally with:
#
#   golangci-lint run ./...
version: "2"

linters:
  settings:
    errcheck:
      # Deliberately-ignored error returns:
      #  - fmt.Fprint* to tabwriter/strings.Builder buffers cannot meaningfully
      #    fail before the (checked) Flush; checking each write is pure noise.
      #  - os.Unsetenv only fails on invalid names; used in test cleanup.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Unsetenv
