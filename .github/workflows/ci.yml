name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Callable as a reusable workflow: the release workflow runs this as its
  # gate, so "release checks" and "CI green" are the same thing by definition.
  workflow_call:

permissions:
  contents: read

# CI runs the same Makefile targets as local dev and the pre-commit hook,
# so there is exactly one definition of every check.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu for speed; macos because it is the tool's primary target
        # (terminal adapters, .bash_profile handling, app-bundle detection).
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Test (race)
        # The git package's integration tests shell out to the real git
        # binary; runners ship with git preinstalled, and the tests neutralize
        # global/system config so they stay hermetic.
        run: make test

  lint:
    # Static analysis is platform-independent; one OS is enough.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: staticcheck
        run: make staticcheck

      - name: errcheck
        run: make errcheck

      - name: go mod tidy drift
        run: make tidy-check

      - name: govulncheck
        run: make vuln
